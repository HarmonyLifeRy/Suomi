<style>
  :root{
    --dawn-cream:#FBEFE6;
    --dawn-rose:#F5D9D2;
    --lavender:#F0E6FA;
    --violet-light:#C4A8E0;
    --violet-deep:#9B6CC4;
    --gold:#C4A060;
    --gold-soft:#D9BC8C;
    --ink:#3D2F4F;
    --ink-soft:#5E4E72;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Manrope',-apple-system,sans-serif;
    color:var(--ink); font-weight:600;
    /* рассвет: тёплый кремово-розовый переход в фирменную лаванду */
    background:linear-gradient(180deg, var(--dawn-cream) 0%, var(--dawn-rose) 34%, var(--lavender) 78%, #EBDDF6 100%);
    min-height:100vh; overflow-x:hidden; position:relative;
    display:flex; flex-direction:column;
  }

  /* ---------- рассветное сияние ---------- */
  .aurora-bg{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .glow{
    position:absolute; border-radius:50%; filter:blur(60px);
    animation:float 18s ease-in-out infinite;
  }
  .glow.g1{ width:340px; height:340px; background:#F7DCC8; opacity:.55; top:-90px; left:50%; transform:translateX(-50%); }
  .glow.g2{ width:240px; height:240px; background:var(--violet-light); opacity:.30; bottom:12%; left:-70px; animation-delay:5s; }
  .glow.g3{ width:220px; height:220px; background:var(--gold); opacity:.16; bottom:24%; right:-60px; animation-delay:9s; }
  @keyframes float{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(14px,-22px) scale(1.06);} }
  .glow.g1{ animation-name:floatC; }
  @keyframes floatC{ 0%,100%{transform:translateX(-50%) scale(1);} 50%{transform:translateX(-50%) translateY(14px) scale(1.05);} }

  .sparkle{ position:absolute; width:4px; height:4px; background:var(--gold); border-radius:50%; opacity:.6; animation:tw 3s ease-in-out infinite; }
  @keyframes tw{ 0%,100%{opacity:.15; transform:scale(1);} 50%{opacity:.9; transform:scale(1.6);} }

  /* ---------- пчёлки ---------- */
  .bee{ position:absolute; width:26px; height:26px; opacity:.85;
    filter:drop-shadow(0 2px 4px rgba(196,160,96,.4));
    animation:fly var(--d,26s) ease-in-out infinite; animation-delay:var(--dl,0s); }
  .bee svg{ width:100%; height:100%; overflow:visible; }
  .bee .wing{ transform-origin:50% 85%; animation:flap .18s ease-in-out infinite alternate; }
  .bee .wing.right{ animation-delay:.09s; }
  @keyframes flap{ from{transform:rotate(-14deg);} to{transform:rotate(14deg);} }
  @keyframes fly{
    0%{ transform:translate(-8vw,20vh) rotate(8deg);}
    30%{ transform:translate(40vw,10vh) rotate(-6deg);}
    60%{ transform:translate(85vw,26vh) rotate(9deg);}
    100%{ transform:translate(-8vw,20vh) rotate(8deg);}
  }
  @keyframes fly2{
    0%{ transform:translate(105vw,62vh) rotate(-8deg) scale(.75);}
    50%{ transform:translate(30vw,74vh) rotate(7deg) scale(.75);}
    100%{ transform:translate(105vw,62vh) rotate(-8deg) scale(.75);}
  }
  .bee.b2{ animation-name:fly2; }

  /* ---------- деревья на горизонте ---------- */
  .horizon{ position:fixed; left:0; right:0; bottom:0; height:110px; z-index:0; pointer-events:none; overflow:hidden; }
  .horizon svg{ position:absolute; bottom:0; left:0; width:200%; height:100%; opacity:.26; }

  /* ---------- контент ---------- */
  .wrap{
    position:relative; z-index:2; flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    max-width:480px; margin:0 auto; padding:36px 22px 130px;
    text-align:center;
  }

  .lang{ display:inline-flex; gap:2px; background:rgba(255,255,255,.6);
    border:1.5px solid rgba(196,160,96,.35); border-radius:50px; padding:4px; margin-bottom:26px; position:relative; }
  .lang button{ position:relative; z-index:1; border:none; background:transparent; padding:7px 14px;
    font-family:inherit; font-size:12.5px; font-weight:800; color:var(--ink-soft); border-radius:50px; cursor:pointer;
    -webkit-tap-highlight-color:transparent; transition:color .2s; }
  .lang button.active{ color:#fff; }
  .lang .ind{ position:absolute; top:4px; bottom:4px; left:4px; width:50px;
    background:linear-gradient(135deg,var(--violet-deep),var(--violet-light));
    border-radius:50px; transition:transform .25s ease,width .25s ease;
    box-shadow:0 4px 14px rgba(155,108,196,.4); }

  .lotus{ width:92px; height:92px; border-radius:50%; overflow:hidden; margin-bottom:18px;
    border:1.5px solid rgba(196,160,96,.5); box-shadow:0 8px 30px rgba(155,108,196,.25); }
  .lotus img{ width:100%; height:100%; object-fit:cover; display:block; }

  h1{
    font-family:'Cormorant Garamond',Georgia,serif; font-weight:700;
    font-size:30px; line-height:1.16; color:var(--violet-deep);
    letter-spacing:.3px; margin-bottom:8px;
  }
  .brandline{ font-size:12px; font-weight:800; letter-spacing:2px; color:var(--gold); margin-bottom:24px; }

  .badge{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.7); border:1.5px solid rgba(196,160,96,.45);
    border-radius:50px; padding:9px 18px; margin-bottom:20px;
    font-size:13px; font-weight:800; color:var(--gold);
  }
  .badge .dot{ width:8px; height:8px; border-radius:50%;
    background:var(--gold); animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.4; transform:scale(.85);} 50%{opacity:1; transform:scale(1.15);} }

  .msg{
    background:rgba(255,255,255,.66);
    border:1.5px solid rgba(196,160,96,.35);
    border-radius:26px; padding:22px 20px;
    box-shadow:0 10px 32px rgba(155,108,196,.16);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    margin-bottom:22px;
  }
  .msg p{ font-size:14.5px; line-height:1.65; color:var(--ink); }
  .msg p + p{ margin-top:12px; }
  .msg b{ color:var(--violet-deep); font-weight:800; }

  .cta{
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    width:100%; background:linear-gradient(135deg,var(--gold),var(--violet-deep) 70%);
    background-size:220% 220%; color:#fff; border:none; border-radius:50px;
    padding:16px 22px; font-family:inherit; font-size:15px; font-weight:800;
    text-decoration:none; cursor:pointer;
    box-shadow:0 10px 28px rgba(155,108,196,.4);
    animation:ctaGlow 5s ease-in-out infinite;
    -webkit-tap-highlight-color:transparent;
    margin-bottom:12px;
  }
  .cta:active{ transform:scale(.97); }
  @keyframes ctaGlow{ 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
  .cta svg{ width:18px; height:18px; stroke:#fff; flex-shrink:0; }

  .ghost{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; background:transparent;
    border:1.4px solid rgba(196,160,96,.5); border-radius:50px;
    padding:13px 22px; font-family:inherit; font-size:13.5px; font-weight:800;
    color:var(--violet-deep); text-decoration:none; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .ghost:active{ transform:scale(.97); }

  footer{
    position:relative; z-index:2; text-align:center; padding:0 20px 26px;
  }
  .hex-row{ display:flex; justify-content:center; gap:6px; margin-bottom:10px; }
  .brand{ font-family:'Cormorant Garamond',serif; font-weight:700; letter-spacing:3px;
    font-size:12px; color:var(--gold); text-transform:uppercase; }
  .yt{ font-size:10px; font-weight:600; color:var(--ink-soft); opacity:.6; margin-top:4px; letter-spacing:.5px; }

  @media (prefers-reduced-motion:reduce){ .glow,.sparkle,.bee,.bee *,.cta,.badge .dot{ animation:none!important; } }
  :focus-visible{ outline:2px solid var(--violet-deep); outline-offset:2px; border-radius:10px; }
</style>
</head>

        const yb = by - h*.86*f0 - h*.05;
        const yt = by - h*.86*f1 - h*.19;
        const wb = w*(1-f0*.55);
        tiers += '<polygon points="'+(x-wb/2).toFixed(1)+','+yb.toFixed(1)+' '+(x+wb/2).toFixed(1)+','+yb.toFixed(1)+' '+x.toFixed(1)+','+yt.toFixed(1)+'" fill="#B98DD6"/>';
      }
      out += tiers;
    } else if(kind < .8){
      out += '<polygon points="'+(x-w/2).toFixed(1)+','+by+' '+(x+w/2).toFixed(1)+','+by+' '+x.toFixed(1)+','+(by-h).toFixed(1)+'" fill="#B98DD6"/>';
    } else {
      out += '<rect x="'+(x-1).toFixed(1)+'" y="'+(by-h*.55).toFixed(1)+'" width="2" height="'+(h*.55).toFixed(1)+'" fill="#B98DD6"/>'
           + '<ellipse cx="'+x.toFixed(1)+'" cy="'+(by-h*.62).toFixed(1)+'" rx="'+(w*.42).toFixed(1)+'" ry="'+(h*.4).toFixed(1)+'" fill="#B98DD6"/>';
    }
  }
  svgEl.innerHTML = out;
})();

/* пчёлки и искры */
(function(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const bg = el("bg");
  [{c:"",d:"28s",dl:"0s"},{c:"b2",d:"34s",dl:"-10s"}].forEach(cfg=>{
    const b = document.createElement("div");
    b.className = "bee " + cfg.c;
    b.style.setProperty("--d", cfg.d);
    b.style.setProperty("--dl", cfg.dl);
    b.innerHTML = '<svg viewBox="0 0 32 32"><use href="#bee"/></svg>';
    bg.appendChild(b);
  });
  for(let i=0;i<7;i++){
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random()*100+"%";
    s.style.top = Math.random()*100+"%";
    s.style.animationDelay = (Math.random()*3)+"s";
    bg.appendChild(s);
  }
})();

/* Telegram */
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(!tg) return;
  try{
    tg.ready(); tg.expand();
    if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if(tg.setHeaderColor) tg.setHeaderColor("#FBEFE6");
    if(tg.setBackgroundColor) tg.setBackgroundColor("#FBEFE6");
  }catch(e){}
  document.addEventListener("click", e=>{
    const a = e.target.closest("a[href^='http']");
    if(!a) return;
    const href = a.getAttribute("href");
    e.preventDefault();
    try{
      if(/^https?:\/\/t\.me\//.test(href) && tg.openTelegramLink){ tg.openTelegramLink(href); }
      else if(tg.openLink){ tg.openLink(href); }
      else{ window.open(href,"_blank"); }
    }catch(err){ window.open(href,"_blank"); }
  });
  const h = tg.HapticFeedback;
  if(h){
    document.addEventListener("click", e=>{
      if(e.target.closest(".cta, .ghost, .lang button")){
        try{ h.impactOccurred("light"); }catch(err){}
      }
    });
  }
})();

render();
setTimeout(moveInd, 60);
window.addEventListener("resize", moveInd);
</script>
</body>
